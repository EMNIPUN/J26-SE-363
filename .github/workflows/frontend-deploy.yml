name: Frontend Deploy (Vercel)

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'testing'
        type: choice
        options:
          - testing
          - production

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Environment & Project ID
        id: env-config
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "ENV_NAME=production" >> $GITHUB_OUTPUT
            echo "IS_PROD=--prod" >> $GITHUB_OUTPUT
            echo "PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID_PROD }}" >> $GITHUB_OUTPUT
            echo "PROJECT_LABEL=Production (Main)" >> $GITHUB_OUTPUT
          else
            echo "ENV_NAME=testing" >> $GITHUB_OUTPUT
            echo "IS_PROD=--prod" >> $GITHUB_OUTPUT
            echo "PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID_TESTING }}" >> $GITHUB_OUTPUT
            echo "PROJECT_LABEL=Testing (Dev)" >> $GITHUB_OUTPUT
          fi

      - name: Validate Secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT_ID: ${{ steps.env-config.outputs.PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing GitHub Secret: VERCEL_TOKEN"
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::Missing GitHub Secret: VERCEL_ORG_ID"
            exit 1
          fi
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Missing Project ID Secret for ${{ steps.env-config.outputs.PROJECT_LABEL }}"
            exit 1
          fi
          echo "All required Vercel secrets are present."

      - name: Setup Node.js (LTS 20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.env-config.outputs.PROJECT_ID }}
        run: vercel pull --yes --environment=${{ steps.env-config.outputs.ENV_NAME }} --token=$VERCEL_TOKEN

      - name: Build Project Artifacts via Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.env-config.outputs.PROJECT_ID }}
        run: vercel build ${{ steps.env-config.outputs.IS_PROD }} --token=$VERCEL_TOKEN

      - name: Deploy to Vercel
        id: deploy-step
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.env-config.outputs.PROJECT_ID }}
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt ${{ steps.env-config.outputs.IS_PROD }} --token=$VERCEL_TOKEN)
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deployment successful: $DEPLOY_URL"

      - name: Publish Deployment Summary
        run: |
          echo "### 🚀 Vercel Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment**: \`${{ steps.env-config.outputs.PROJECT_LABEL }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL**: [${{ steps.deploy-step.outputs.DEPLOY_URL }}](${{ steps.deploy-step.outputs.DEPLOY_URL }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: \`${{ github.event_name }}\` on \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
