name: Performance Assessment Guard

on:
  pull_request:
    paths:
      - 'backend/agentic_framework/app/agents/performance_assessment/**'
      - '.github/scripts/check_assessment_access.py'
      - '.github/workflows/performance-assessment-guard.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'backend/agentic_framework/app/agents/performance_assessment/**'
      - '.github/scripts/check_assessment_access.py'
      - '.github/workflows/performance-assessment-guard.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-authorization:
    name: Verify Assessment Agent Authorization
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Access Guard Check
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SADEESHA_EMAIL: ${{ secrets.SADEESHA_EMAIL }}
          AUTHORIZED_USERS: ${{ secrets.AUTHORIZED_USERS }}
          AUTHORIZED_EMAILS: ${{ secrets.AUTHORIZED_EMAILS }}
          PROTECTED_PATH: ${{ secrets.PROTECTED_PATH }}
        run: |
          python .github/scripts/check_assessment_access.py
