# Wording of the link-by-code pages. No single quotes: MessageFormat treats them as escapes.
linkCodeWrong=That code is not right. Check it and try again.
linkCodeExpired=That code has expired. Send a new one.
linkCodeLocked=Too many wrong tries. Send a new code.
linkCodeWait=Please wait a moment before asking for another code.
linkCodeTooManyEmails=A code was already sent three times. Start again from the sign-in page.
linkCodeNotSent=We could not send the email. Try again in a moment.
