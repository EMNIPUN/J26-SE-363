# Wording of the emails Keycloak sends. {0} is the link and {3} how long it works.
# MessageFormat treats a single quote as an escape character, so none are used here.

emailVerificationSubject=Verify your email
emailVerificationBody=Confirm your email address to finish creating your SELVIA account:\n\n{0}\n\nThe link works for {3}. If you did not create this account, ignore this email.
emailVerificationBodyHtml=<p><strong>Confirm your email address</strong></p><p>Finish creating your SELVIA account. The link works for {3}.</p><p style="margin:24px 0"><a href="{0}" style="display:inline-block;background:#5146c7;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:6px;font-weight:600">Verify email</a></p><p style="font-size:12px;color:#6b7280">If you did not create this account, ignore this email.</p>

passwordResetSubject=Reset your password
passwordResetBody=Use this link to choose a new SELVIA password:\n\n{0}\n\nThe link works for {3}. If you did not ask for this, ignore this email.
passwordResetBodyHtml=<p><strong>Reset your password</strong></p><p>Use the button to choose a new SELVIA password. The link works for {3}.</p><p style="margin:24px 0"><a href="{0}" style="display:inline-block;background:#5146c7;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:6px;font-weight:600">Choose a new password</a></p><p style="font-size:12px;color:#6b7280">If you did not ask for this, ignore this email.</p>
