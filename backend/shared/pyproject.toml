[project]
name = "selvia-shared"
version = "0.1.0"
description = "Code shared by the SELVIA Core API and AI Backend: Pydantic contracts and the Procrastinate job queue."
requires-python = ">=3.11"
dependencies = [
    "procrastinate>=3.10.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
