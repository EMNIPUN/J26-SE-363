[project]
name = "selvia-effort-model"
version = "0.1.0"
description = "Experiments for the SELVIA Effort factor model (notebooks)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[dependency-groups]
notebooks = [
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "nbconvert>=7.16",
]

[tool.uv]
package = false
default-groups = ["notebooks"]
