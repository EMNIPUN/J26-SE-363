[project]
name = "selvia-agentic-framework"
version = "0.1.0"
description = "SELVIA multi-agent framework: LangGraph agents and the Procrastinate worker that runs them."
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastembed>=0.6.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.2",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langsmith>=0.14.1",
    "joblib>=1.4.0",
    "mcp>=1.9,<2",
    "neo4j>=6.3.1",
    "openai>=3.19.2",
    "numpy>=2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "rank-bm25>=0.2.2",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "transformers>=4.45",
    "selvia-shared",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.uv.sources]
selvia-shared = { path = "../shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["app", "tests"]
pythonpath = ["."]
# the factor packages have their own unittest suites (run from factor_models/, they need pandas and use their own import paths)
norecursedirs = ["factor_models", ".venv", "node_modules"]
markers = [
    "integration: runs real scanner binaries (CodeQL, Gitleaks, ...); slow, only on request",
    "live: calls a real LLM API and needs an API key; only on request",
]
# Default = fast suite. Real scanners and live LLM calls run only with: pytest -m integration / pytest -m live
addopts = "-m 'not integration and not live'"
