# Alembic configuration for the Core API database. Run every command from backend/server/.
# The database URL is NOT stored here: alembic/env.py reads it from the Core API settings
# (SERVER_DIRECT_URL, else SERVER_DATABASE_URL, in backend/server/.env), or from
# `-x db_url=...` for a single command. See docs/SERVER_DATABASE_GUIDE.md.

[alembic]
script_location = %(here)s/alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path entry so env.py can import the `app` package
prepend_sys_path = .

path_separator = os

[post_write_hooks]

# Logging configuration, consumed by alembic/env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
